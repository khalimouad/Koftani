<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="amiradoree-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221a0f"/>
      <stop offset="100%" stop-color="#120d07"/>
    </linearGradient>
    <linearGradient id="amiradoree-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5b06a"/>
      <stop offset="100%" stop-color="#8a6a35"/>
    </linearGradient>
    <linearGradient id="amiradoree-au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e2b0" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#f3e2b0"/>
      <stop offset="100%" stop-color="#f3e2b0" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="amiradoree-glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f3e2b0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f3e2b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amiradoree-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="amiradoree-pat" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M42 12 L47 32 L67 37 L47 42 L42 62 L37 42 L17 37 L37 32 Z" fill="none" stroke="#f3e2b0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#amiradoree-bg)"/>
  <rect width="600" height="800" fill="url(#amiradoree-pat)"/>
  <rect width="600" height="800" fill="url(#amiradoree-glow)"/>

  <!-- arch frame -->
  <path d="M90 760 L90 300 C90 140 180 45 300 18 C420 45 510 140 510 300 L510 760"
        fill="none" stroke="#f3e2b0" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M106 760 L106 305 C106 155 190 66 300 40 C410 66 494 155 494 305 L494 760"
        fill="none" stroke="#f3e2b0" stroke-opacity="0.16" stroke-width="1"/>

  <!-- caftan -->
  <g transform="translate(300, 150)">
    <path d="M0 0 C-16 30 -40 44 -66 53 L-132 88 C-152 99 -163 117 -167 143 L-192 560 L-108 560 L-99 610 L99 610 L108 560 L192 560 L167 143 C163 117 152 99 132 88 L66 53 C40 44 16 30 0 0 Z"
          fill="url(#amiradoree-g)" stroke="url(#amiradoree-au)" stroke-width="2.4"/>
    <path d="M-60 40 C-30 200 -30 420 -50 596 L-20 596 C-8 420 -8 200 -14 60 Z"
          fill="url(#amiradoree-sheen)"/>

    <!-- neckline -->
    <path d="M0 6 C-9 36 -9 66 0 100 C9 66 9 36 0 6 Z" fill="url(#amiradoree-au)"/>
    <path d="M-24 22 C-14 66 -14 96 -8 118 M24 22 C14 66 14 96 8 118"
          fill="none" stroke="#f3e2b0" stroke-opacity="0.6" stroke-width="1.4"/>

    <!-- sfifa center line + aakad buttons -->
    <path d="M0 100 L0 596" stroke="url(#amiradoree-au)" stroke-width="2" stroke-dasharray="1 9"/>
    <g>
      <circle cx="0" cy="150" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="150" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="205" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="205" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="260" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="260" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="315" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="315" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="370" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="370" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="425" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="425" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="480" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="480" r="2" fill="#f3e2b0"/>
    </g>
    <g>
      <circle cx="0" cy="535" r="6" fill="none" stroke="#f3e2b0" stroke-width="1.3"/>
      <circle cx="0" cy="535" r="2" fill="#f3e2b0"/>
    </g>

    <!-- mdamma belt -->
    <path d="M-64 258 C-24 246 24 246 64 258 L64 286 C24 274 -24 274 -64 286 Z"
          fill="#120d07" stroke="url(#amiradoree-au)" stroke-width="2"/>
    <circle cx="0" cy="270" r="9" fill="none" stroke="#f3e2b0" stroke-width="1.6"/>
    <circle cx="0" cy="270" r="3" fill="#f3e2b0"/>
    <path d="M-40 264 L-24 268 M40 264 L24 268" stroke="#f3e2b0" stroke-opacity="0.7" stroke-width="1.3"/>

    <!-- sleeve embroidery -->
    <path d="M-167 150 C-150 162 -128 168 -104 168 M167 150 C150 162 128 168 104 168"
          fill="none" stroke="#f3e2b0" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M-171 190 C-152 202 -128 208 -102 208 M171 190 C152 202 128 208 102 208"
          fill="none" stroke="#f3e2b0" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- hem embroidery -->
    <path d="M-99 610 C-46 586 46 586 99 610" fill="none" stroke="url(#amiradoree-au)" stroke-width="2"/>
    <path d="M-94 596 C-44 574 44 574 94 596" fill="none" stroke="#f3e2b0" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M-64 581.04 l0 -12" stroke="#f3e2b0" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M-32 585.52 l0 -12" stroke="#f3e2b0" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M0 590 l0 -12" stroke="#f3e2b0" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M32 585.52 l0 -12" stroke="#f3e2b0" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M64 581.04 l0 -12" stroke="#f3e2b0" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>

  <!-- base line -->
  <line x1="90" y1="760" x2="510" y2="760" stroke="#f3e2b0" stroke-opacity="0.35" stroke-width="2"/>
</svg>